<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>르노코리아 영업사원 통합 업무 툴</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f0f2f5; margin: 0; }
        .transition-all { transition: all 0.3s ease-in-out; }

        /* 보안/비밀번호 화면 CSS */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; }
        .auth-box { background: white; padding: 40px; border-radius: 12px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        .auth-box h2 { margin-top: 0; font-weight: 800; font-size: 1.5rem; margin-bottom: 10px; }
        .auth-box p { color: #666; margin-bottom: 20px; font-size: 0.95rem; }
        .auth-box input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; box-sizing: border-box; text-align: center; }
        .auth-box button { width: 100%; background: #111; color: #f1c40f; padding: 14px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .auth-box button:hover { background: #333; }
        .error-msg { color: #d32f2f; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: bold; }
        
        #main-content { display: none; }

        /* [탭 1] 시승 안내 문자 전용 CSS */
        .sms-wrapper { padding: 40px 20px; display: flex; justify-content: center; }
        .sms-container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; box-sizing: border-box; }
        .sms-container h2 { text-align: center; color: #222; margin-top: 0; margin-bottom: 25px; letter-spacing: -1px; font-weight: bold; font-size: 1.5rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 14px; }
        .sms-container input[type="text"], .sms-container input[type="date"], .sms-container select, .sms-container textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 15px; transition: all 0.3s; }
        .sms-container input:focus, .sms-container select:focus, .sms-container textarea:focus { border-color: #0056b3; outline: none; box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }
        .sms-container textarea { resize: vertical; line-height: 1.6; }
        #rawMessage { height: 120px; background-color: #fafafa; border: 2px dashed #ccc; }
        #result { height: 280px; background-color: #ffffff; font-size: 14px; }
        .action-btn { width: 100%; padding: 14px; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .action-btn:active { transform: scale(0.97); }
        .btn-parse { background-color: #f39c12; }
        .btn-parse:hover { background-color: #e67e22; }
        .btn-generate { background-color: #2c3e50; }
        .btn-generate:hover { background-color: #1a252f; }
        .btn-copy { background-color: #27ae60; margin-bottom: 0; }
        .btn-copy:hover { background-color: #219150; }
        .sms-container hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
        .highlight-flash { background-color: #fff3cd !important; }

        /* [탭 2] 시승 이후 문자 전용 CSS */
        .card-wrapper { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; color: #333; }
        .admin-panel { background: #fff; width: 100%; max-width: 420px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .admin-panel h3 { margin: 0 0 15px 0; font-size: 1rem; color: #555; border-left: 4px solid #f1c40f; padding-left: 10px; font-weight: bold; }
        .row-inputs { display: flex; gap: 10px; margin-bottom: 10px; }
        .admin-panel select { flex: 1; padding: 12px; font-size: 0.95rem; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; box-sizing: border-box; }
        .file-upload-wrapper { position: relative; width: 100%; margin-bottom: 8px; }
        .file-upload-btn { display: block; width: 100%; box-sizing: border-box; padding: 12px; background-color: #f8f9fa; color: #333; text-align: center; border-radius: 8px; font-size: 0.9rem; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .logo-btn { background-color: #fff8e1; border-color: #f1c40f; color: #856404; }
        .btn-save { width: 100%; padding: 15px; background-color: #111; color: #f1c40f; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .guide-text { font-size: 0.8rem; color: #888; margin-top: 10px; text-align: center; }

        .mobile-card { background: #fff; width: 100%; max-width: 400px; overflow: hidden; position: relative; border: 1px solid #eee; box-sizing: border-box; }
        .card-header { padding: 15px 20px; text-align: center; border-bottom: 1px solid #f8f8f8; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-header img.logo { max-height: 45px; width: auto; margin-bottom: 8px; }
        .card-header .branch { font-size: 0.8rem; color: #777; line-height: 1.5; font-weight: 500; }
        .hero { position: relative; width: 100%; height: 230px; background-color: #222; display: flex; align-items: center; justify-content: center; }
        .hero .placeholder { position: absolute; color: #aaa; font-size: 0.95rem; z-index: 1; text-align: center; }
        .hero img { position: relative; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
        .hero-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); padding: 18px 20px; color: white; z-index: 3; text-align: left; }
        .hero-overlay h2 { margin: 0; font-size: 1.7rem; font-weight: 800; font-style: italic; letter-spacing: 1px; }
        .hero-overlay p { margin: 3px 0 0; font-size: 0.95rem; color: #f1c40f; font-weight: 600; }
        .card-content { padding: 25px 20px; }
        .editable { border: 1px dashed transparent; transition: 0.2s; cursor: text; border-radius: 4px; padding: 2px; }
        .editable:hover, .editable:focus { outline: none; border-color: #f1c40f; background: #fffdf0; }
        .message { font-size: 0.95rem; line-height: 1.6; color: #444; margin-bottom: 20px; word-break: keep-all; }
        .contact-area { text-align: center; padding-top: 15px; border-top: 1px solid #eee; }
        .rep-info { font-size: 1.15rem; font-weight: 700; color: #111; margin-bottom: 5px; }
        .rep-phone { font-size: 1.6rem; font-weight: 800; color: #0000ee; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>영업 자동화 툴</h2>
            <p>허용된 팀원만 접근 가능합니다.</p>
            <input type="password" id="pwdInput" placeholder="비밀번호를 입력하세요" onkeypress="if(event.keyCode==13) checkPwd()">
            <div class="error-msg" id="errorMsg">비밀번호가 일치하지 않습니다.</div>
            <button onclick="checkPwd()">접속하기</button>
        </div>
    </div>

    <div id="main-content">
        <div class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-center space-x-2 py-4">
                    <button id="tab-btn-sms" class="px-6 py-2.5 bg-black text-yellow-400 font-bold rounded-lg shadow-md transition-all hover:scale-105 cursor-pointer flex items-center gap-2">
                        <i data-lucide="message-square-text" class="w-5 h-5"></i> 시승 예약 문자
                    </button>
                    <button id="tab-btn-card" class="px-6 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-lg shadow transition-all hover:bg-gray-300 cursor-pointer flex items-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i> 시승 이후 문자
                    </button>
                </div>
            </div>
        </div>

        <div id="section-sms" class="sms-wrapper">
            <div class="sms-container">
                <h2>시승 안내 문자 생성기</h2>
                <div class="form-group">
                    <label for="rawMessage">대표님 전달 메시지 붙여넣기</label>
                    <textarea id="rawMessage" placeholder="전달받은 메시지를 여기에 붙여넣으세요..."></textarea>
                </div>
                <button type="button" class="action-btn btn-parse" id="parseBtn">✨ 내용 자동 분류하기</button>
                <hr>
                <div class="form-group">
                    <label for="branch">시승 대리점</label>
                    <select id="branch">
                        <option value="geumjeong">금정대리점</option>
                        <option value="yeonje">연제대리점</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="customerName">고객성함</label>
                    <input type="text" id="customerName" placeholder="고객명을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="date">시승일자 (달력)</label>
                    <input type="date" id="date">
                </div>
                <div class="form-group">
                    <label for="time">시승시간</label>
                    <input type="text" id="time" placeholder="예: 16시">
                </div>
                <div class="form-group">
                    <label for="vehicle">시승차종</label>
                    <!-- 요청하신 3가지 차종으로만 제한됨 -->
                    <select id="vehicle">
                        <option value="필랑트">필랑트</option>
                        <option value="그랑콜레오스 E-Tech 하이브리드">그랑콜레오스 E-Tech 하이브리드</option>
                        <option value="아르카나(가솔린)">아르카나(가솔린)</option>
                    </select>
                </div>
                <button type="button" class="action-btn btn-generate" id="generateBtn">📩 안내 문자 생성</button>
                <div class="form-group">
                    <label for="result">최종 문자 내용 (직접 수정 가능)</label>
                    <textarea id="result" placeholder="생성된 문자가 이곳에 나타납니다. 자유롭게 수정하실 수 있습니다."></textarea>
                </div>
                <button type="button" class="action-btn btn-copy" id="copyBtn">📋 내용 복사하기</button>
            </div>
        </div>

        <div id="section-card" class="card-wrapper hidden">
            <div class="admin-panel">
                <h3>시승 감사 문자 설정</h3>
                
                <div class="file-upload-wrapper">
                    <div class="file-upload-btn logo-btn">🚩 르노 로고 직접 등록 (오류 시)</div>
                    <input type="file" accept="image/*" id="logoInput">
                </div>

                <div class="row-inputs">
                    <select id="carSelect">
                        <option value="filante">필랑트 (Filante)</option>
                        <option value="koleos">그랑 콜레오스 (Grand Koleos)</option>
                        <option value="arkana">아르카나 (Arkana)</option>
                    </select>
                    <select id="repSelect">
                        <option value="lee">이상헌</option>
                        <option value="kang">강명수</option>
                        <option value="kwon">권성호</option>
                    </select>
                </div>
                <div class="file-upload-wrapper">
                    <div class="file-upload-btn">📷 차량 이미지 변경</div>
                    <input type="file" accept="image/*" id="carInput">
                </div>
                <button class="btn-save" id="saveBtn">📸 최종 안내 이미지 저장</button>
                <div class="guide-text">💡 아래 내용을 확인하고 저장하세요. (텍스트 클릭 시 즉석 수정 가능)</div>
            </div>

            <div class="mobile-card" id="cardArea">
                <div class="card-header">
                    <img id="mainLogo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Renault_2021_Logo.svg/2560px-Renault_2021_Logo.svg.png" alt="Renault" class="logo">
                    <div class="branch">
                        <strong>르노코리아</strong><br>
                    </div>
                </div>
                <div class="hero">
                    <div class="placeholder" id="imgNotice">이미지를 등록해주세요.</div>
                    <img id="displayImg" src="">
                    <div class="hero-overlay">
                        <h2 id="dispCarTitle">Filante</h2>
                        <p id="dispCarSub">E-Tech</p>
                    </div>
                </div>
                <div class="card-content">
                    <div class="message editable" contenteditable="true" id="dispMessage"></div>
                    <div class="contact-area">
                        <div class="rep-info">르노코리아 영업담당 <span id="dispName">이상헌</span></div>
                        <div class="rep-phone" id="dispPhone">010-8978-0186</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkPwd() {
            const input = document.getElementById('pwdInput').value;
            if(input === '89780186') {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        lucide.createIcons();

        const btnSms = document.getElementById('tab-btn-sms');
        const btnCard = document.getElementById('tab-btn-card');
        const secSms = document.getElementById('section-sms');
        const secCard = document.getElementById('section-card');

        btnSms.addEventListener('click', () => {
            secSms.style.display = 'flex';
            secCard.style.display = 'none';
            btnSms.className = "px-6 py-2.5 bg-black text-yellow-400 font-bold rounded-lg shadow-md transition-all hover:scale-105 cursor-pointer flex items-center gap-2";
            btnCard.className = "px-6 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-lg shadow transition-all hover:bg-gray-300 cursor-pointer flex items-center gap-2";
        });

        btnCard.addEventListener('click', () => {
            secSms.style.display = 'none';
            secCard.style.display = 'flex';
            btnCard.className = "px-6 py-2.5 bg-black text-yellow-400 font-bold rounded-lg shadow-md transition-all hover:scale-105 cursor-pointer flex items-center gap-2";
            btnSms.className = "px-6 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-lg shadow transition-all hover:bg-gray-300 cursor-pointer flex items-center gap-2";
        });

        const branchInfo = {
            geumjeong: { fullName: "르노코리아 금정대리점", shortName: "금정점", address: "금정구 중앙대로 1640" },
            yeonje: { fullName: "르노코리아 연제대리점", shortName: "연제점", address: "연제구 과정로 205" }
        };

        const rawInput = document.getElementById('rawMessage');
        const parseBtn = document.getElementById('parseBtn');
        const branchSelect = document.getElementById('branch');
        const nameInput = document.getElementById('customerName');
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        const vehicleSelect = document.getElementById('vehicle');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resultArea = document.getElementById('result');

        function flash(el) {
            el.classList.add('highlight-flash');
            setTimeout(() => el.classList.remove('highlight-flash'), 800);
        }

        parseBtn.addEventListener('click', () => {
            const txt = rawInput.value;
            if(!txt) return alert("내용을 입력해주세요.");
            let found = false;
            if(txt.includes("금정")) { branchSelect.value = "geumjeong"; flash(branchSelect); found = true; }
            else if(txt.includes("연제")) { branchSelect.value = "yeonje"; flash(branchSelect); found = true; }
            const nMatch = txt.match(/\[([가-힣]{2,4})\]/);
            if(nMatch) { nameInput.value = nMatch[1]; flash(nameInput); found = true; }
            
            const lowTxt = txt.toLowerCase().replace(/\s/g, '');
            
            // 3가지 제한된 차종에 맞게 매칭 로직 업데이트
            if(lowTxt.includes("arkana") || lowTxt.includes("아르카나")) {
                vehicleSelect.value = "아르카나(가솔린)";
                flash(vehicleSelect); found = true;
            } else if(lowTxt.includes("grandkoleos") || lowTxt.includes("그랑콜레오스") || lowTxt.includes("콜레오스")) {
                vehicleSelect.value = "그랑콜레오스 E-Tech 하이브리드";
                flash(vehicleSelect); found = true;
            } else if(lowTxt.includes("filante") || lowTxt.includes("필랑트")) {
                vehicleSelect.value = "필랑트";
                flash(vehicleSelect); found = true;
            }

            const dMatch = txt.match(/(\d{1,2})[-/.](\d{1,2})|(\d{1,2})월\s*(\d{1,2})일/);
            if(dMatch) {
                const year = new Date().getFullYear();
                const m = (dMatch[1] || dMatch[3]).padStart(2, '0');
                const d = (dMatch[2] || dMatch[4]).padStart(2, '0');
                dateInput.value = `${year}-${m}-${d}`;
                flash(dateInput);
                found = true;
            }
            const tMatch = txt.match(/(\d{1,2})\s*시/);
            if(tMatch) { timeInput.value = tMatch[1] + "시"; flash(timeInput); found = true; }
            if(found) {
                parseBtn.innerText = "✅ 분류 완료!";
                setTimeout(() => parseBtn.innerText = "✨ 내용 자동 분류하기", 1500);
            }
        });

        generateBtn.addEventListener('click', () => {
            const br = branchInfo[branchSelect.value];
            const name = nameInput.value || "ㅇㅇㅇ";
            let time = timeInput.value || "00시";
            const car = vehicleSelect.value;
            if(time === "4시") time = "16시";
            else if(time === "1시") time = "13시";
            else if(time === "2시") time = "14시";
            else if(time === "3시") time = "15시";
            else if(time === "5시") time = "17시";
            let dateStr = "00. 00.00(ㅇ)";
            if(dateInput.value) {
                const d = new Date(dateInput.value);
                const yy = String(d.getFullYear()).slice(-2);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const weeks = ['일','월','화','수','목','금','토'];
                dateStr = `${yy}. ${mm}.${dd}(${weeks[d.getDay()]})`;
            }
            resultArea.value = `[${br.fullName}]\n\n${name} 고객님 안녕하세요.\n저희 ${br.shortName} 시승예약&상담신청을 해주셔서 감사합니다.\n\n-시승일자/시간 : ${dateStr} ${time}\n-시승차종 : ${car}\n-시승장소 : ${br.fullName}\n(주소: ${br.address})\n\n★다른 시승 고객님을 위해 시승시간 준수 부탁드리며 시승시에는 담당영업팀장이 동승하여 시승 운영 합니다\n★전시장 방문시 운전면허증 지참 바랍니다\n\n※ 혹시 시승일정 연기나 취소 필요한 고객께서는 사전에 반드시 연락 주시기 바랍니다`;
        });

        copyBtn.addEventListener('click', () => {
            if(!resultArea.value) return alert("복사할 내용이 없습니다.");
            resultArea.select();
            document.execCommand('copy');
            const origin = copyBtn.innerText;
            copyBtn.innerText = "✅ 복사되었습니다!";
            copyBtn.style.backgroundColor = "#219150";
            setTimeout(() => { copyBtn.innerText = origin; copyBtn.style.backgroundColor = "#27ae60"; }, 1500);
            window.getSelection().removeAllRanges();
        });

        const reps = {
            lee: { name: "이상헌", phone: "010-8978-0186" },
            kang: { name: "강명수", phone: "010-6358-0357" },
            kwon: { name: "권성호", phone: "010-2884-1583" }
        };

        const cars = {
            filante: { title: "Filante", sub: "E-Tech", korName: "필랑트", img: null },
            koleos: { title: "Grand Koleos", sub: "E-Tech", korName: "그랑 콜레오스", img: null },
            arkana: { title: "Arkana", sub: "E-Tech", korName: "아르카나", img: null }
        };

        function updateCardView() {
            const carKey = document.getElementById("carSelect").value;
            const repKey = document.getElementById("repSelect").value;
            document.getElementById("dispCarTitle").textContent = cars[carKey].title;
            document.getElementById("dispCarSub").textContent = cars[carKey].sub;
            const selectedRep = reps[repKey];
            document.getElementById("dispName").textContent = selectedRep.name;
            document.getElementById("dispPhone").textContent = selectedRep.phone;
            const branchName = "연제/금정대리점"; 
            const jobTitle = "영업담당";
            
            const letterHtml = `
                <div style="font-weight: 800; font-size: 1.05rem; margin-bottom: 15px; color: #111; text-align: center;">[르노코리아] 고객님, 어제 시승은 편안하셨는지요?</div>
                안녕하세요. 고객님.<br>
                르노코리아 ${branchName}의 ${selectedRep.name} ${jobTitle}입니다.<br><br>
                바쁜 일정 중에도 귀한 시간을 내어 <strong>${cars[carKey].korName}</strong> 시승을 함께해 주셔서 진심으로 감사드립니다.<br><br>
                어제 함께한 드라이빙이 기분 좋은 여운으로 남으셨기를 바랍니다. 대화를 나누며 가족을 위해 신중하게 차를 고르시는 따뜻한 마음을 깊이 느낄 수 있었습니다.<br><br>
                <div style="display: block; text-align: center; font-size: 0.95rem; font-weight: 700; color: #d32f2f; background: #fdf2f2; padding: 22px 15px; border-radius: 12px; margin: 20px 0; border: 1px solid #f9e1e1; word-break: keep-all; line-height: 1.6; box-sizing: border-box;">
                    "단순히 차를 판매하는 것이 아니라,<br>고객님의 일상에 가장 잘 맞는 든든한 동반자를 찾아드리겠습니다."
                </div>
                차량은 일상의 중요한 공간인 만큼 천천히 고민해 보시고, 궁금하신 점이나 혜택 안내가 필요하실 땐 언제든 편하게 연락 주십시오. 정직하고 든든한 길잡이가 되어드리겠습니다.<br><br>
                늘 안전운전 하시기를 기원합니다. 감사합니다.<br>
                <strong>르노코리아 ${branchName} ${selectedRep.name} 올림</strong>
            `;
            document.getElementById("dispMessage").innerHTML = letterHtml;
            const imgTag = document.getElementById("displayImg");
            const notice = document.getElementById("imgNotice");
            if(cars[carKey].img) {
                imgTag.src = cars[carKey].img;
                imgTag.style.display = "block";
                notice.style.display = "none";
            } else {
                imgTag.style.display = "none";
                notice.style.display = "block";
            }
        }

        document.getElementById("logoInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const logoImg = document.getElementById("mainLogo");
                    logoImg.src = event.target.result;
                    logoImg.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("carSelect").addEventListener("change", updateCardView);
        document.getElementById("repSelect").addEventListener("change", updateCardView);

        document.getElementById("carInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const currentCarKey = document.getElementById("carSelect").value;
                    cars[currentCarKey].img = event.target.result; 
                    updateCardView(); 
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("saveBtn").addEventListener("click", function() {
            const target = document.getElementById("cardArea");
            if (document.activeElement) document.activeElement.blur();
            const originalWidth = target.style.width;
            const originalMaxWidth = target.style.maxWidth;
            target.style.width = "430px";
            target.style.maxWidth = "430px";
            html2canvas(target, {
                scale: 3, 
                useCORS: true,
                backgroundColor: "#ffffff",
                width: 430, 
                windowWidth: 430 
            }).then(canvas => {
                target.style.width = originalWidth;
                target.style.maxWidth = originalMaxWidth;
                const link = document.createElement('a');
                link.download = `르노코리아_시승이후안내.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        });

        updateCardView();
    </script>
</body>
</html>
